<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahtab Photo Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:white;font-family:'Space Grotesk',sans-serif}
.menu-pill{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.85);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);padding:10px 12px 10px 22px;border-radius:100px;z-index:1000;display:flex;align-items:center;gap:25px}
.menu-logo{font-size:13px;letter-spacing:3px;font-weight:600}.menu-links{display:flex;gap:6px;list-style:none}.menu-links a{color:#888;text-decoration:none;font-size:12px;padding:7px 14px;border-radius:100px;transition:0.3s}.menu-links a.active,.menu-links a:hover{background:white;color:black}.menu-dot{width:8px;height:8px;background:#00ff88;border-radius:50%}.hamburger{display:none;background:white;color:black;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer}
@media(max-width:650px){.menu-pill{width:92%;justify-content:space-between}.menu-links{display:none;position:absolute;top:55px;left:0;width:100%;background:rgba(15,15,15,0.95);border-radius:20px;flex-direction:column;padding:15px}.menu-links.show{display:flex}.hamburger{display:block}}
.gallery{column-count:3;column-gap:12px;padding:90px 12px 40px;max-width:1600px;margin:auto}@media(max-width:900px){.gallery{column-count:2}}@media(max-width:500px){.gallery{column-count:1}}
.pic{position:relative;margin-bottom:12px;border-radius:18px;overflow:hidden;break-inside:avoid;background:#111;cursor:pointer}
.pic img{width:100%;display:block;transition:0.6s}
.pic:hover img{transform:scale(1.08);filter:brightness(0.35) blur(1px)}
.pic.active img{transform:scale(1.08);filter:brightness(0.35) blur(1px)}
.wm{position:absolute;bottom:12px;left:12px;font-size:10px;opacity:0.6;z-index:2}
.pic-text{position:absolute;bottom:0;left:0;right:0;padding:18px 15px 12px;background:linear-gradient(to top, rgba(0,0,0,0.95), transparent);opacity:0;transition:0.4s;z-index:2}
.pic:hover .pic-text{opacity:1}
.pic:hover .info{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}
.pic.active .pic-text{opacity:1}
.pic-text h4{font-size:13px;letter-spacing:1px}.pic-text p{font-size:11px;color:#aaa}
.info{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:rgba(0,0,0,0.6);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.15);padding:10px 12px;border-radius:100px;display:flex;gap:6px;opacity:0;transition:0.4s;pointer-events:none;z-index:3;align-items:center}
/*.pic:hover .info{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}*/
.pic.active .info{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}
.info button{background:white;color:black;border:none;padding:8px 12px;border-radius:100px;cursor:pointer;font-size:11px;font-weight:600}.paid-btn{background:#00ff88!important;color:#000!important;padding:8px 14px;border-radius:100px;font-size:11px;font-weight:700;text-decoration:none;border:none;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:9999;justify-content:center;align-items:center;padding:15px}.modal.show{display:flex}
.story-box{background:#111;border:1px solid #222;border-radius:24px;max-width:750px;width:100%;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr}@media(max-width:650px){.story-box{grid-template-columns:1fr}}
.story-box img{width:100%;height:100%;object-fit:cover;max-height:500px}.story-content{padding:25px}.story-content h2{font-size:20px;margin-bottom:8px}.story-content.meta{font-size:11px;color:#ff3c00;margin-bottom:15px}.story-content p{font-size:13px;color:#bbb;line-height:1.8}.close-btn{margin-top:20px;background:#1e1e1e;color:white;border:none;padding:10px 18px;border-radius:100px;cursor:pointer}
.down-box,.pay-box{background:#151515;border:1px solid #222;padding:25px;border-radius:24px;width:90%;max-width:360px;text-align:center}
.down-box a{display:block;padding:14px;margin:10px 0;background:#1c1c1c;border-radius:12px;color:white;text-decoration:none}.down-box a:hover{background:white;color:black}
.pay-box input,.pay-box textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;margin:8px 0;outline:none;font-family:inherit}
.pay-box textarea{resize:none;height:80px}
.footer-wrap{padding:60px 15px 30px;display:flex;justify-content:center}.footer-pill{background:rgba(18,18,18,0.9);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:20px 30px;max-width:800px;width:100%;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
.footer-left h3{font-size:14px;letter-spacing:2px}.footer-left p{font-size:11px;color:#777;margin-top:6px}.footer-right{display:flex;gap:10px}.footer-right a{width:38px;height:38px;background:#1e1e1e;border-radius:50%;display:flex;justify-content:center;align-items:center;text-decoration:none;color:#aaa}.footer-right a:hover{background:white;color:black}
.footer-copy{width:100%;text-align:center;margin-top:15px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.06);font-size:10px;color:#555}
.admin-upload-wrap{position:fixed;bottom:24px;right:20px;z-index:1001;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#uploadStatus{background:rgba(20,20,20,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:10px 16px;border-radius:100px;font-size:11px;display:none}
#realUpBtn{background:rgba(18,18,18,0.9);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:11px 18px 11px 14px;border-radius:100px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
#realUpBtn .up-icon{width:26px;height:26px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<nav class="menu-pill"><div style="display:flex;align-items:center;gap:10px"><div class="menu-dot"></div><div class="menu-logo">PHOTOGRAPHY</div></div><ul class="menu-links" id="menuLinks"><li><a href="index.html" class="active">GALLERY</a></li><li><a href="paid.html">PAID 4K 🔥</a></li><li><a href="about.html">ABOUT</a></li><li><a href="contact.html">CONTACT</a></li></ul><button class="hamburger" onclick="document.getElementById('menuLinks').classList.toggle('show')">☰</button></nav>

<div class="gallery" id="mainGallery"></div>

<div id="storyModal" class="modal" onclick="this.classList.remove('show')"><div class="story-box" onclick="event.stopPropagation()"><img id="storyImg" src=""><div class="story-content"><h2 id="storyTitle"></h2><div class="meta" id="storyLoc"></div><p id="storyText"></p><button class="close-btn" onclick="document.getElementById('storyModal').classList.remove('show')">Close ✕</button></div></div></div>
<div id="downModal" class="modal" onclick="this.classList.remove('show')"><div class="down-box" onclick="event.stopPropagation()"><p style="margin-bottom:15px;color:#888;font-size:12px;letter-spacing:2px">DOWNLOAD FREE</p><a href="#" id="smallL" download>Small - 800px</a><a href="#" id="medL" download>Medium - 1920px</a><p style="margin-top:20px;font-size:11px;color:#555;cursor:pointer" onclick="document.getElementById('downModal').classList.remove('show')">close</p></div></div>
<div id="payModal" class="modal" onclick="closePay()"><div class="pay-box" onclick="event.stopPropagation()"><h3 style="margin:0">Pay 5 PKR - Get 4K</h3><p style="color:#aaa;font-size:12px;margin-top:10px">NayaPay pe 5 PKR bhejo:</p><div style="background:#000;padding:10px;border-radius:12px;border:1px dashed #00ff88;color:#00ff88;font-weight:bold;margin:10px 0;font-size:13px">malikmahtabawan@nayapay</div><input id="txnInput" placeholder="Transaction ID"><button class="paid-btn" style="width:100%;padding:12px" onclick="verifyAndDownload()">Verify & Download 4K</button><p style="font-size:11px;color:#666;margin-top:12px;cursor:pointer" onclick="closePay()">Cancel</p></div></div>
<div id="uploadInfoModal" class="modal"><div class="pay-box" style="max-width:400px" onclick="event.stopPropagation()"><h3 style="margin:0 0 10px 0">Add Details</h3><input id="upTitle" placeholder="Title"><input id="upLocation" placeholder="Location" value="📍 Multan"><textarea id="upStory" placeholder="Story / Caption"></textarea><button class="paid-btn" style="width:100%;padding:12px;margin-top:10px" onclick="confirmUpload()">Upload Now 🚀</button><p style="font-size:11px;color:#666;margin-top:12px;cursor:pointer" onclick="closeUploadInfo()">Cancel</p></div></div>

<div class="footer-wrap"><div class="footer-pill"><div class="footer-left"><h3>MAHTAB AWAN</h3><p>Photographer • 100% Original Work</p></div><div class="footer-right"><a href="mailto:mahtabawan03@gmail.com">✉️</a><a href="tel:03249587706">📞</a><a href="#">IG</a></div><div class="footer-copy">© 2026 MAHTAB PHOTO GALLERY</div></div></div>

<script>
const CLOUD_NAME = "n6wuj0io"; const UPLOAD_PRESET = "mahtab_gallery"; const ADMIN_PASSWORD = "861255";
let isAdmin = sessionStorage.getItem('mahtab_admin') === 'true'; let pendingFiles = [];
function checkAdmin(){ if(isAdmin) return true; let p = prompt("🔒 Admin Password:"); if(p === ADMIN_PASSWORD){ isAdmin=true; sessionStorage.setItem('mahtab_admin','true'); return true; } else { if(p!==null) alert("❌ Galat Password"); return false; } }
let current4k = "";
function openStory(btn){let c=btn.closest('.pic');document.getElementById('storyImg').src=c.querySelector('img').src;document.getElementById('storyTitle').innerText=c.dataset.title;document.getElementById('storyLoc').innerText=c.dataset.location;document.getElementById('storyText').innerText=c.dataset.story;document.getElementById('storyModal').classList.add('show');}
function openDown(btn){let src=btn.closest('.pic').querySelector('img').src;document.getElementById('smallL').href=src;document.getElementById('medL').href=src;document.getElementById('downModal').classList.add('show');}
function openPay(btn){current4k=btn.closest('.pic').querySelector('img').src;document.getElementById('payModal').classList.add('show');}
function closePay(){document.getElementById('payModal').classList.remove('show');}
function verifyAndDownload(){let txn=document.getElementById('txnInput').value;if(txn.length<5){alert("Sahi Transaction ID likho");return;}let a=document.createElement('a');a.href=current4k;a.download="MEHTAB-4K.jpg";a.click();closePay();}
function closeUploadInfo(){document.getElementById('uploadInfoModal').classList.remove('show'); pendingFiles=[];}

// FIX: Mobile Tap + Remove Broken Images
document.addEventListener('click', function(e){
  let pic = e.target.closest('.pic');
  if(pic && !e.target.closest('.info') && !e.target.closest('button')){
    document.querySelectorAll('.pic').forEach(p=>{ if(p!==pic) p.classList.remove('active') });
    pic.classList.toggle('active');
  }
});
document.addEventListener('error', function(e){
  if(e.target.tagName === 'IMG'){ let p=e.target.closest('.pic'); if(p) p.remove(); }
}, true);

(function(){
  let saved = JSON.parse(localStorage.getItem('mahtabGallery')||'[]');
  let galleryDiv = document.getElementById('mainGallery');
  // Clean old broken data
  saved = saved.filter(p => p.url && p.url.startsWith('http'));
  localStorage.setItem('mahtabGallery', JSON.stringify(saved));
  saved.reverse().forEach(p=>{
    let div = document.createElement('div'); div.className = 'pic';
    div.dataset.title = p.title; div.dataset.location = p.location; div.dataset.story = p.story;
    div.innerHTML = `<img src="${p.url}" loading="lazy" onerror="this.closest('.pic').remove()"><div class="wm">© MEHTAB</div><div class="pic-text"><h4>${p.title}</h4><p>${p.location}</p></div><div class="info"><button onclick="openStory(this)">👁️</button><button onclick="openDown(this)">Free</button><button class="paid-btn" onclick="openPay(this)">4K - 5 PKR</button></div>`;
    galleryDiv.prepend(div);
  });
})();

const cloudInput = document.createElement('input'); cloudInput.type = 'file'; cloudInput.accept = 'image/*'; cloudInput.multiple = true; cloudInput.style.display = 'none'; document.body.appendChild(cloudInput);
const upBtn = document.createElement('div'); upBtn.className = 'admin-upload-wrap'; upBtn.innerHTML = `<div id="uploadStatus"></div><button id="realUpBtn"><span class="up-icon">↗</span> UPLOAD</button>`; document.body.appendChild(upBtn);
document.getElementById('realUpBtn').onclick = ()=> { if(!checkAdmin()) return; cloudInput.click(); };
cloudInput.addEventListener('change', (e)=>{ pendingFiles = [...e.target.files]; if(pendingFiles.length===0) return; document.getElementById('upTitle').value = pendingFiles[0].name.replace(/\.[^/.]+$/, ""); document.getElementById('upLocation').value = "📍 Multan"; document.getElementById('upStory').value = ""; document.getElementById('uploadInfoModal').classList.add('show'); });
async function confirmUpload(){ let title = document.getElementById('upTitle').value || "New Photo"; let location = document.getElementById('upLocation').value || "📍 Multan"; let story = document.getElementById('upStory').value || "Uploaded"; document.getElementById('uploadInfoModal').classList.remove('show'); for(let file of pendingFiles){ await uploadToCloudinary(file, {title, location, story}); } pendingFiles=[]; cloudInput.value=''; }
async function uploadToCloudinary(file, meta){
  const status = document.getElementById('uploadStatus'); status.style.display='block'; status.textContent = 'Uploading...';
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET); fd.append('folder', 'mahtab_gallery');
  try{ const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:'POST', body:fd }); const data = await res.json();
    if(data.secure_url){ let div = document.createElement('div'); div.className = 'pic'; div.dataset.title = meta.title; div.dataset.location = meta.location; div.dataset.story = meta.story; div.innerHTML = `<img src="${data.secure_url}" loading="lazy" onerror="this.closest('.pic').remove()"><div class="wm">© MEHTAB</div><div class="pic-text"><h4>${meta.title}</h4><p>${meta.location}</p></div><div class="info"><button onclick="openStory(this)">👁️</button><button onclick="openDown(this)">Free</button><button class="paid-btn" onclick="openPay(this)">4K - 5 PKR</button></div>`; document.getElementById('mainGallery').prepend(div); let old = JSON.parse(localStorage.getItem('mahtabGallery')||'[]'); old.push({url:data.secure_url, title:meta.title, location:meta.location, story:meta.story}); localStorage.setItem('mahtabGallery', JSON.stringify(old)); status.textContent = 'Uploaded! ✅'; setTimeout(()=>status.style.display='none',2000); }
  }catch(err){ status.textContent = 'Failed'; }
}
</script>
</body>
</html>
