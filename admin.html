<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahtab Gallery - Admin</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;padding:20px;max-width:800px;margin:auto}
.card{background:#222;padding:20px;border-radius:12px;margin-bottom:20px;border:1px solid #333}
input,textarea{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#333;color:#fff;box-sizing:border-box}
button{background:#4CAF50;color:#fff;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;width:100%}
.gallery-item{background:#2a2a2a;padding:10px;border-radius:10px;margin:10px 0;display:flex;gap:10px;align-items:center}
.gallery-item img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.delete{background:#ff4444;width:auto;padding:5px 12px;margin-left:auto}
</style></head>
<body>
<h2>Mahtab Gallery - Admin</h2>
<div class="card">
<h3>Add New Photo</h3>
<input type="file" id="photoInput" accept="image/*">
<input type="text" id="titleInput" placeholder="Ghanta Ghar Multan - The Golden Heritage">
<textarea id="captionInput" placeholder="Bathed in the golden glow..."></textarea>
<button onclick="addPhoto()">Add Photo to Gallery</button>
</div>
<div class="card"><h3>Gallery Photos (<span id="count">0</span>)</h3><div id="galleryList"></div></div>
<script>
let photos=JSON.parse(localStorage.getItem('mahtab_gallery')||'[]');
function render(){
 document.getElementById('count').innerText=photos.length;
 let html=''; if(photos.length==0){html='Abhi koi nayi photo add nahi hui';}
 else{photos.forEach((p,i)=>{html+=`<div class="gallery-item"><img src="${p.src}"><div><b>${p.title}</b><br><small>${p.caption.substring(0,60)}</small></div><button class="delete" onclick="deletePhoto(${i})">Delete</button></div>`;});}
 document.getElementById('galleryList').innerHTML=html;
}
function addPhoto(){
 const file=document.getElementById('photoInput').files[0];
 const title=document.getElementById('titleInput').value;
 const caption=document.getElementById('captionInput').value;
 if(!file){alert('Photo select karo');return;}
 const reader=new FileReader();
 reader.onload=(e)=>{photos.push({src:e.target.result,title,caption});localStorage.setItem('mahtab_gallery',JSON.stringify(photos));render();alert('Ho gayi add! Total:'+photos.length);};
 reader.readAsDataURL(file);
}
function deletePhoto(i){photos.splice(i,1);localStorage.setItem('mahtab_gallery',JSON.stringify(photos));render();}
render();
</script></body></html>
