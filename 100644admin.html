<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin - Mahtab</title><style>body{font-family:Arial;background:#111;color:#fff;padding:20px;text-align:center}input,button{padding:12px;margin:8px;width:90%;max-width:400px;border-radius:8px;border:none}button{background:#7c3aed;color:#fff;font-weight:bold}.card{background:#1f1f1f;padding:15px;border-radius:12px;margin:15px auto;max-width:400px}img{width:100%;border-radius:10px}</style></head><body><div id="login"><h2>🔐 Admin Login</h2><input type="password" id="pass" placeholder="Password"><br><button onclick="login()">Login</button><p style="font-size:12px;color:#888">Pass: mahtab123</p></div><div id="panel" style="display:none"><h2>📸 Photo Add Karo</h2><input type="file" id="imgFile" accept="image/*"><br><input type="text" id="title" placeholder="Title"><br><button onclick="addPhoto()">Add to Gallery</button><div id="preview"></div><p><a href="index.html" style="color:#7c3aed">← Gallery Dekho</a></p></div><script>function login(){if(document.getElementById('pass').value==='mahtab123'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';}else alert('Galat Password');}function addPhoto(){const f=document.getElementById('imgFile').files[0];const t=document.getElementById('title').value||'Mahtab Photo';if(!f){alert('Photo select karo');return;}const r=new FileReader();r.onload=function(e){let g=JSON.parse(localStorage.getItem('mahtab_gallery')||'[]');g.push({img:e.target.result,title:t});localStorage.setItem('mahtab_gallery',JSON.stringify(g));document.getElementById('preview').innerHTML=`<div class="card"><img src="${e.target.result}"><p>${t}</p><p style="color:lightgreen">✅ Ho gayi Add!</p></div>`;};r.readAsDataURL(f);}</script></body></html>
