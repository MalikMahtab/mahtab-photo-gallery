<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehtab Photo Gallery</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:white;font-family:'Space Grotesk',sans-serif}
.menu-pill{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.85);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);padding:10px 12px 10px 22px;border-radius:100px;z-index:1000;display:flex;align-items:center;gap:25px}
.menu-logo{font-size:13px;letter-spacing:3px;font-weight:600}.menu-links{display:flex;gap:6px;list-style:none}.menu-links a{color:#888;text-decoration:none;font-size:12px;padding:7px 14px;border-radius:100px}.menu-links a.active{background:white;color:black}
.menu-dot{width:8px;height:8px;background:#00ff88;border-radius:50%}.hamburger{display:none;background:white;color:black;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer}
@media(max-width:650px){.menu-pill{width:92%;justify-content:space-between}.menu-links{display:none;position:absolute;top:55px;left:0;width:100%;background:#111;border-radius:20px;flex-direction:column;padding:15px}.menu-links.show{display:flex}.hamburger{display:block}}
.wrap{max-width:1100px;margin:100px auto 40px;padding:0 15px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin-top:30px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden;padding-bottom:15px}.card img{width:100%;height:200px;object-fit:cover}
.paid-btn{background:#00ff88;color:#000;padding:9px 16px;border-radius:100px;font-weight:700;font-size:12px;border:none;cursor:pointer;margin-top:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:9999;justify-content:center;align-items:center;padding:15px}.modal.show{display:flex}
.pay-box{background:#151515;border:1px solid #222;padding:25px;border-radius:24px;width:90%;max-width:360px;text-align:center}
.pay-box input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;margin:12px 0}
</style>
</head>
<body>
<nav class="menu-pill"><div style="display:flex;align-items:center;gap:10px"><div class="menu-dot"></div><div class="menu-logo">PHOTOGRAPHY</div></div><ul class="menu-links" id="menuLinks"><li><a href="index.html">GALLERY</a></li><li><a href="paid.html" class="active">PAID 4K 🔥</a></li><li><a href="about.html">ABOUT</a></li><li><a href="contact.html">CONTACT</a></li></ul><button class="hamburger" onclick="document.getElementById('menuLinks').classList.toggle('show')">☰</button></nav>

<div class="wrap">
<h1>PAID 4K COLLECTION 🔥</h1>
<p style="color:#666;font-size:13px;margin-top:8px">Original 4K Quality - Only 5 PKR per pic</p>
<p style="color:#444;font-size:11px;margin-top:5px">NayaPay ID: malikmahtabawan@nayapay</p>

<div class="grid">
  <div class="card"><img src="multan.highlights-3.jpg"><h4 style="margin:10px 0 2px;font-size:13px">Ghanta Ghar 4K</h4><p style="font-size:11px;color:#555">3840x2160</p><button class="paid-btn" onclick="openPay(this)">Buy 4K - 5 PKR</button></div>
  <!-- Aur pics yahan add karte jao same copy karke -->
</div>
</div>

<div id="payModal" class="modal" onclick="closePay()"><div class="pay-box" onclick="event.stopPropagation()">
<h3>Pay 5 PKR - Get 4K</h3>
<p style="color:#aaa;font-size:12px;margin-top:10px">ID pe 5 PKR bhejo:</p>
<div style="background:#000;padding:10px;border-radius:12px;border:1px dashed #00ff88;color:#00ff88;font-weight:bold;margin:10px 0;font-size:13px">malikmahtabawan@nayapay</div>
<input id="txnInput" placeholder="Transaction ID likho">
<button class="paid-btn" style="width:100%;padding:12px" onclick="verify()">Verify & Download</button>
<p style="font-size:11px;color:#666;margin-top:12px;cursor:pointer" onclick="closePay()">Cancel</p>
</div></div>

<script>
let cur="";
function openPay(b){cur=b.closest('.card').querySelector('img').src;document.getElementById('payModal').classList.add('show');}
function closePay(){document.getElementById('payModal').classList.remove('show');}
function verify(){
 if(document.getElementById('txnInput').value.length<5){alert("Sahi ID likho");return;}
 let a=document.createElement('a');a.href=cur;a.download="MEHTAB-4K.jpg";a.click();
 closePay();alert("Shukriya ❤️ Download ho raha hai");
}
</script>
</body>
</html>
