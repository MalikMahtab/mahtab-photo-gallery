<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehtab Photo Gallery - Paid 4K</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{background:#080808;color:white;font-family:'Space Grotesk',sans-serif}
.menu-pill{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.85);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);padding:10px 12px 10px 22px;border-radius:100px;z-index:1000;display:flex;align-items:center;gap:25px}
.menu-logo{font-size:13px;letter-spacing:3px;font-weight:600}.menu-links{display:flex;gap:6px;list-style:none}.menu-links a{color:#888;text-decoration:none;font-size:12px;padding:7px 14px;border-radius:100px;transition:0.3s}.menu-links a.active,.menu-links a:hover{background:white;color:black}
.menu-dot{width:8px;height:8px;background:#00ff88;border-radius:50%}.hamburger{display:none;background:white;color:black;border:none;width:34px;height:34px;border-radius:50%;cursor:pointer}
@media(max-width:650px){.menu-pill{width:92%;justify-content:space-between}.menu-links{display:none;position:absolute;top:55px;left:0;width:100%;background:#111;border-radius:20px;flex-direction:column;padding:15px}.menu-links.show{display:flex}.hamburger{display:block}}
.wrap{max-width:1100px;margin:100px auto 40px;padding:0 15px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px;margin-top:30px}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden;padding-bottom:15px;transition:0.3s}.card:hover{border-color:#333;transform:translateY(-3px)}
.card img{width:100%;height:220px;object-fit:cover;display:block;background:#0a0a0a}
.paid-btn{background:#00ff88;color:#000;padding:9px 16px;border-radius:100px;font-weight:700;font-size:12px;border:none;cursor:pointer;margin-top:8px;transition:0.3s}.paid-btn:hover{transform:scale(1.05)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);z-index:9999;justify-content:center;align-items:center;padding:15px}.modal.show{display:flex}
.pay-box{background:#151515;border:1px solid #222;padding:25px;border-radius:24px;width:90%;max-width:360px;text-align:center}
.pay-box input,.pay-box textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;margin:8px 0;outline:none;font-family:inherit}
.pay-box textarea{resize:none;height:80px}
/* Upload button - same as gallery */
.admin-upload-wrap{position:fixed;bottom:24px;right:20px;z-index:1001;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#uploadStatus{background:rgba(20,20,20,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:10px 16px;border-radius:100px;font-size:11px;display:none}
#realUpBtn{background:rgba(18,18,18,0.9);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:11px 18px 11px 14px;border-radius:100px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,0.5)}
#realUpBtn .up-icon{width:26px;height:26px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center}
</style>
</head>
<body>
<nav class="menu-pill"><div style="display:flex;align-items:center;gap:10px"><div class="menu-dot"></div><div class="menu-logo">PHOTOGRAPHY</div></div><ul class="menu-links" id="menuLinks"><li><a href="index.html">GALLERY</a></li><li><a href="paid.html" class="active">PAID 4K 🔥</a></li><li><a href="about.html">ABOUT</a></li><li><a href="contact.html">CONTACT</a></li></ul><button class="hamburger" onclick="document.getElementById('menuLinks').classList.toggle('show')">☰</button></nav>

<div class="wrap">
<h1>PAID 4K COLLECTION 🔥</h1>
<p style="color:#666;font-size:13px;margin-top:8px">Original 4K Quality - Only 5 PKR per pic</p>
<p style="color:#444;font-size:11px;margin-top:5px">NayaPay ID: malikmahtabawan@nayapay</p>

<div class="grid" id="paidGrid">
  <div class="card"><img src="multan.highlights-3.jpg" onerror="this.closest('.card').style.display='none'"><h4 style="margin:10px 0 2px;font-size:13px">Ghanta Ghar 4K</h4><p style="font-size:11px;color:#555">3840x2160</p><button class="paid-btn" onclick="openPay(this)">Buy 4K - 5 PKR</button></div>
</div>
</div>

<div id="payModal" class="modal" onclick="closePay()"><div class="pay-box" onclick="event.stopPropagation()">
<h3>Pay 5 PKR - Get 4K</h3>
<p style="color:#aaa;font-size:12px;margin-top:10px">ID pe 5 PKR bhejo:</p>
<div style="background:#000;padding:10px;border-radius:12px;border:1px dashed #00ff88;color:#00ff88;font-weight:bold;margin:10px 0;font-size:13px">malikmahtabawan@nayapay</div>
<input id="txnInput" placeholder="Transaction ID likho">
<button class="paid-btn" style="width:100%;padding:12px" onclick="verify()">Verify & Download</button>
<p style="font-size:11px;color:#666;margin-top:12px;cursor:pointer" onclick="closePay()">Cancel</p>
</div></div>

<div id="uploadInfoModal" class="modal"><div class="pay-box" style="max-width:400px" onclick="event.stopPropagation()"><h3 style="margin:0 0 10px 0">Add Paid Photo</h3><input id="upTitle" placeholder="Title - e.g. Ghanta Ghar 4K"><input id="upLocation" placeholder="Resolution - e.g. 3840x2160" value="3840x2160"><textarea id="upStory" placeholder="Description"></textarea><button class="paid-btn" style="width:100%;padding:12px;margin-top:10px" onclick="confirmUpload()">Upload to Paid 🚀</button><p style="font-size:11px;color:#666;margin-top:12px;cursor:pointer" onclick="closeUploadInfo()">Cancel</p></div></div>

<script>
const CLOUD_NAME = "n6wuj0io"; const UPLOAD_PRESET = "mahtab_gallery"; const ADMIN_PASSWORD = "861255";
let isAdmin = sessionStorage.getItem('mahtab_admin') === 'true'; let pendingFiles = [];
function checkAdmin(){ if(isAdmin) return true; let p = prompt("🔒 Admin Password:"); if(p === ADMIN_PASSWORD){ isAdmin=true; sessionStorage.setItem('mahtab_admin','true'); return true; } else { if(p!==null) alert("❌ Galat Password"); return false; } }

let cur="";
function openPay(b){cur=b.closest('.card').querySelector('img').src;document.getElementById('payModal').classList.add('show');}
function closePay(){document.getElementById('payModal').classList.remove('show');}
function verify(){
 if(document.getElementById('txnInput').value.length<5){alert("Sahi ID likho");return;}
 let a=document.createElement('a');a.href=cur;a.download="MEHTAB-4K-"+Date.now()+".jpg";a.click();
 closePay();alert("Shukriya ❤️ Download ho raha hai");
}
function closeUploadInfo(){document.getElementById('uploadInfoModal').classList.remove('show'); pendingFiles=[];}

// Auto remove broken images
document.addEventListener('error', function(e){
  if(e.target.tagName === 'IMG'){ let c=e.target.closest('.card'); if(c) c.style.display='none'; }
}, true);

// Load saved paid photos from localStorage
(function(){
  let saved = JSON.parse(localStorage.getItem('mahtabPaidGallery')||'[]');
  saved = saved.filter(p => p.url && p.url.startsWith('http'));
  localStorage.setItem('mahtabPaidGallery', JSON.stringify(saved));
  let grid = document.getElementById('paidGrid');
  saved.reverse().forEach(p=>{
    let div = document.createElement('div'); div.className='card';
    div.innerHTML = `<img src="${p.url}" onerror="this.closest('.card').remove()"><h4 style="margin:10px 0 2px;font-size:13px">${p.title}</h4><p style="font-size:11px;color:#555">${p.location}</p><button class="paid-btn" onclick="openPay(this)">Buy 4K - 5 PKR</button>`;
    grid.prepend(div);
  });
})();

const cloudInput = document.createElement('input'); cloudInput.type = 'file'; cloudInput.accept = 'image/*'; cloudInput.multiple = true; cloudInput.style.display = 'none'; document.body.appendChild(cloudInput);
const upBtn = document.createElement('div'); upBtn.className = 'admin-upload-wrap'; upBtn.innerHTML = `<div id="uploadStatus"></div><button id="realUpBtn"><span class="up-icon">↗</span> UPLOAD</button>`; document.body.appendChild(upBtn);
document.getElementById('realUpBtn').onclick = ()=> { if(!checkAdmin()) return; cloudInput.click(); };
cloudInput.addEventListener('change', (e)=>{ pendingFiles = [...e.target.files]; if(pendingFiles.length===0) return; document.getElementById('upTitle').value = pendingFiles[0].name.replace(/\.[^/.]+$/, ""); document.getElementById('upLocation').value = "3840x2160"; document.getElementById('upStory').value = ""; document.getElementById('uploadInfoModal').classList.add('show'); });
async function confirmUpload(){ let title = document.getElementById('upTitle').value || "4K Photo"; let location = document.getElementById('upLocation').value || "3840x2160"; let story = document.getElementById('upStory').value || ""; document.getElementById('uploadInfoModal').classList.remove('show'); for(let file of pendingFiles){ await uploadToCloudinary(file, {title, location, story}); } pendingFiles=[]; cloudInput.value=''; }
async function uploadToCloudinary(file, meta){
  const status = document.getElementById('uploadStatus'); status.style.display='block'; status.textContent = 'Uploading...';
  const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', UPLOAD_PRESET); fd.append('folder', 'mahtab_gallery_paid');
  try{ const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:'POST', body:fd }); const data = await res.json();
    if(data.secure_url){ let grid=document.getElementById('paidGrid'); let div=document.createElement('div'); div.className='card'; div.innerHTML=`<img src="${data.secure_url}" onerror="this.closest('.card').remove()"><h4 style="margin:10px 0 2px;font-size:13px">${meta.title}</h4><p style="font-size:11px;color:#555">${meta.location}</p><button class="paid-btn" onclick="openPay(this)">Buy 4K - 5 PKR</button>`; grid.prepend(div); let old=JSON.parse(localStorage.getItem('mahtabPaidGallery')||'[]'); old.push({url:data.secure_url, title:meta.title, location:meta.location}); localStorage.setItem('mahtabPaidGallery', JSON.stringify(old)); status.textContent='Uploaded! ✅'; setTimeout(()=>status.style.display='none',2000); }
  }catch(err){ status.textContent='Failed'; }
}
</script>
</body>
</html>
